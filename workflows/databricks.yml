bundle:
  name: agent_discovery_workflow

variables:
  catalog:
    default: your_catalog
    description: Unity Catalog name for Delta tables
  schema:
    default: control_plane
    description: Schema name for Delta tables
  lakebase_dns:
    description: Lakebase PostgreSQL DNS hostname
  lakebase_database:
    default: control_plane
    description: Lakebase database name
  lakebase_instance:
    default: ""
    description: Lakebase instance name for Provisioned credential generation (leave empty for Autoscaling)
  lakebase_endpoint_path:
    default: ""
    description: Lakebase endpoint path for Autoscaling credential generation (e.g. projects/<name>/branches/<branch>/endpoints/<endpoint>). Leave empty for Provisioned.
  account_id:
    description: Databricks account ID for cross-workspace operations (find in your workspace URL or account console)
  account_host:
    default: "https://accounts.cloud.databricks.com"
    description: "Account console host for the Budgets API (AWS default; use accounts.azuredatabricks.net or accounts.gcp.databricks.com on other clouds)."
  warehouse_id:
    description: SQL warehouse ID for system table queries
  trace_retention_days:
    default: "90"
    description: "Time window (days) for trace detail caching. UI offers 7/14/30/90; this is the upper bound the discovery workflow caches."
  enable_cross_workspace_rest_fanout:
    default: "false"
    description: "Tier 3 prototype (parked). When 'true', the observability discovery task fans out MLflow REST calls across all workspaces using SP creds. Off by default — destination workspaces reject these calls today (HTTP 403 cert validation). Cross-workspace observability is served by UC SQL paths instead (Tier 2)."
  gateway_log_retention_days:
    default: "30"
    description: "Time window (days) for Unity Gateway / inference-log payload caching."
  gateway_log_max_rows_per_table:
    default: "10000"
    description: "Per-source-table cap on rows pulled per inference-log discovery run."
  billing_retention_days:
    default: "90"
    description: "Time window (days) for billing data caching. Pulled from system.billing.usage (~24h platform lag)."
  discovery_sp_secret_scope:
    default: ""
    description: "Databricks secret scope holding the discovery SP's OAuth creds (keys: client_id, client_secret). Empty disables SP-based cross-workspace auth."
  narrow_test_workspace_id:
    default: ""
    description: "If set, observability discovery only fans out to this single workspace_id. Use during SP rollout testing; leave empty for full fan-out."
  genie_space_id:
    default: ""
    description: "Explicit Genie space pin for the app's Ask Genie tab. Leave empty to let the setup_genie_space task auto-provision one over the discovered tables and record it in billing_cache_meta (the app then resolves it dynamically). Set it to a hand-curated space id to pin that space and skip auto-provisioning."
  genie_share_group:
    default: "users"
    description: "Group granted CAN_RUN on the auto-provisioned Genie space so app users can query it via OBO. Empty = don't share (only the creator/admins can query)."
  llm_classifier_endpoint:
    default: "databricks-claude-sonnet-5-5"
    description: "Foundation-model serving endpoint used by 12_classify_models (LLM tier) to classify the long tail of empty-task model names. Chosen by benchmark (30 real prod names vs an opus-5-5 reference): sonnet-5-5 scored 100% family / 93% subtype agreement with reliable JSON — small/cheap models (gpt-5-mini 50%, nano 60%) and OSS/reasoning models (gpt-oss, qwen, gemini-flash: unparseable JSON) were materially worse. Caching makes it a ~one-time backfill (~$1 for ~1,700 models), so accuracy > per-token price. Endpoints are per-workspace; leave empty to disable the LLM tier (artifact + regex + compute_type only)."

resources:
  jobs:
    agent_discovery:
      name: "control-plane-agent-discovery"
      description: >
        Scheduled job that discovers all AI agents and MLflow observability
        data across workspaces, then syncs everything to Lakebase for the
        Control Plane dashboard.

      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      tasks:
        - task_key: discover_agents
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Discover agents from APIs + system tables → Delta table"
          notebook_task:
            notebook_path: ./01_discover_agents.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              delta_table: discovered_agents
          environment_key: default

        - task_key: discover_observability
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Tier 1: discover local-workspace MLflow traces (default backend) via REST → Delta. Cross-workspace fan-out is parked (Tier 3); see enable_cross_workspace_rest_fanout."
          notebook_task:
            notebook_path: ./04_discover_observability.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              account_id: ${var.account_id}
              lakebase_dns: ${var.lakebase_dns}
              lakebase_database: ${var.lakebase_database}
              lakebase_instance: ${var.lakebase_instance}
              lakebase_endpoint_path: ${var.lakebase_endpoint_path}
              trace_retention_days: ${var.trace_retention_days}
              enable_cross_workspace_rest_fanout: ${var.enable_cross_workspace_rest_fanout}
              discovery_sp_secret_scope: ${var.discovery_sp_secret_scope}
              narrow_test_workspace_id: ${var.narrow_test_workspace_id}
          environment_key: default

        - task_key: discover_knowledge_bases
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Discover Vector Search + Lakebase + billing costs → Delta"
          notebook_task:
            notebook_path: ./03_discover_knowledge_bases.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
          environment_key: default

        - task_key: discover_user_analytics
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Query system.serving.endpoint_usage for user activity → Delta"
          notebook_task:
            notebook_path: ./05_discover_user_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
          environment_key: default

        - task_key: discover_gateway_usage
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Query system.serving.endpoint_usage for Unity Gateway usage → Delta"
          notebook_task:
            notebook_path: ./06_discover_gateway_usage.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
          environment_key: default

        - task_key: discover_uc_otel_traces
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Discover UC-stored MLflow OTel traces account-wide via SQL (Tier 2b) → Delta"
          notebook_task:
            notebook_path: ./07_discover_uc_otel_traces.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              trace_retention_days: ${var.trace_retention_days}
          environment_key: default

        - task_key: discover_gateway_inference_logs
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Discover Unity Gateway / Model Serving inference-log payload tables account-wide via SQL (Tier 2a) → Delta"
          notebook_task:
            notebook_path: ./08_discover_gateway_inference_logs.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              retention_days: ${var.gateway_log_retention_days}
              max_rows_per_table: ${var.gateway_log_max_rows_per_table}
          environment_key: default

        - task_key: discover_billing
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Query system.billing.usage + system.serving.endpoint_usage for serving cost / token / per-user / all-product daily aggregates → Delta. Replaces the in-app refresh that used to run on app startup."
          notebook_task:
            notebook_path: ./09_discover_billing.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              billing_retention_days: ${var.billing_retention_days}
          environment_key: default

        - task_key: discover_ai_gateway_usage
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Query system.ai_gateway.usage (v2 Unity Gateway, ~20-min fresh) for a per-endpoint usage summary incl. cached tokens + latency/TTFB → Delta. Additive to billing (cost) and serving.endpoint_usage (broad)."
          notebook_task:
            notebook_path: ./11_discover_ai_gateway_usage.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
          environment_key: default

        - task_key: classify_models
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Serving Stage 3: classify empty-task custom models → model_classification (Delta) via a tiered classifier — MLflow artifact (flavor/loader/signature) → name regex → LLM (small FM endpoint) → compute_type. Decoupled side-channel — discover_agents reads it fail-open + upgrade-only, never waits on it; cached per (model,version)."
          notebook_task:
            notebook_path: ./12_classify_models.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              llm_endpoint: ${var.llm_classifier_endpoint}
          environment_key: default

        - task_key: discover_budgets
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Read the account Budgets API (/api/2.1/accounts/{id}/budgets) → Delta (uag_budget_status). Read-only config inventory: cap thresholds, enforce (BLOCK_USAGE) vs alert-only, filter, AI-relevance. Needs account-SP creds in discovery_sp_secret_scope; degrades to empty otherwise."
          notebook_task:
            notebook_path: ./13_discover_budgets.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              account_id: ${var.account_id}
              account_host: ${var.account_host}
              discovery_sp_secret_scope: ${var.discovery_sp_secret_scope}
          environment_key: default

        - task_key: discover_endpoint_inventory
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Account-wide served-entity inventory from system.serving.served_entities → Delta (serving_endpoints_inventory). Read-only fleet view across all workspaces in the metastore."
          notebook_task:
            notebook_path: ./14_discover_endpoint_inventory.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: default

        - task_key: discover_model_services
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "v3 Unity Gateway UC model services via UC REST (run-as metastore admin — the list endpoint the app's OBO/SP identities can't reach) → Delta (model_services_inventory)."
          notebook_task:
            notebook_path: ./15_discover_model_services.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: default

        - task_key: sync_to_lakebase
          # Absorb transient failures (UC 429 rate limits on system tables, serverless pip blips).
          max_retries: 2
          min_retry_interval_millis: 120000
          description: "Sync all discovery data (Delta → Lakebase) + system table billing"
          depends_on:
            - task_key: discover_agents
            - task_key: discover_endpoint_inventory
            - task_key: discover_observability
            - task_key: discover_knowledge_bases
            - task_key: discover_user_analytics
            - task_key: discover_gateway_usage
            - task_key: discover_uc_otel_traces
            - task_key: discover_gateway_inference_logs
            - task_key: discover_billing
            - task_key: discover_ai_gateway_usage
            - task_key: discover_budgets
            - task_key: discover_model_services
          notebook_task:
            notebook_path: ./02_sync_to_lakebase.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              delta_table: discovered_agents
              lakebase_dns: ${var.lakebase_dns}
              lakebase_database: ${var.lakebase_database}
              lakebase_instance: ${var.lakebase_instance}
              lakebase_endpoint_path: ${var.lakebase_endpoint_path}
              account_id: ${var.account_id}
              warehouse_id: ${var.warehouse_id}
          environment_key: default

        - task_key: smoke_check_lakebase
          description: "Assert every Lakebase table the dashboard reads from exists with the expected row content. Fails the workflow if a required table is missing or empty (e.g. silent CREATE TABLE skips)."
          depends_on:
            - task_key: sync_to_lakebase
          notebook_task:
            notebook_path: ./10_smoke_check_lakebase.py
            base_parameters:
              lakebase_dns: ${var.lakebase_dns}
              lakebase_database: ${var.lakebase_database}
              lakebase_instance: ${var.lakebase_instance}
              lakebase_endpoint_path: ${var.lakebase_endpoint_path}
          environment_key: default

        - task_key: setup_genie_space
          description: "Auto-provision the 'Agent Control Plane Analytics' Genie space over the discovered Delta tables and record its id in billing_cache_meta so the app's Ask Genie tab appears with no manual setup/redeploy. Idempotent (create-or-update), self-healing, best-effort (never fails the run)."
          depends_on:
            - task_key: sync_to_lakebase
          notebook_task:
            notebook_path: ./17_setup_genie_space.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              lakebase_dns: ${var.lakebase_dns}
              lakebase_database: ${var.lakebase_database}
              lakebase_instance: ${var.lakebase_instance}
              lakebase_endpoint_path: ${var.lakebase_endpoint_path}
              genie_space_id: ${var.genie_space_id}
              genie_share_group: ${var.genie_share_group}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-sdk
              - psycopg2-binary
              - requests
              - mlflow

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1

      tags:
        project: ai-control-plane
        component: discovery

targets:
  # Copy and customize a target for your workspace.
  # See docs/installation.md for configuration details.
  # Set EITHER lakebase_endpoint_path (Autoscaling) OR lakebase_instance (Provisioned).
  dev:
    mode: development
    default: true
    variables:
      catalog: <your-catalog>                   # e.g. main, my_catalog
      schema: control_plane
      lakebase_dns: <your-lakebase-dns>         # e.g. ep-xxxx.database.cloud.databricks.com
      lakebase_endpoint_path: <your-endpoint>   # Autoscaling: projects/<name>/branches/<branch>/endpoints/<endpoint>
      lakebase_instance: ""                     # Provisioned only — leave empty for Autoscaling
      warehouse_id: <your-warehouse-id>         # SQL warehouse ID for system table queries
      account_id: <your-account-id>             # Databricks account ID

  prod:
    mode: development
    variables:
      catalog: <your-catalog>
      schema: control_plane
      lakebase_dns: <your-lakebase-dns>
      lakebase_endpoint_path: <your-endpoint>
      lakebase_instance: ""
      warehouse_id: <your-warehouse-id>
      account_id: <your-account-id>
