name: Release

# Pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) publishes a
# GitHub Release whose notes are that version's section of CHANGELOG.md.
# See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Section header: "## [0.2.0] - 2026-05-01" with an optional " — Title" suffix.
          HEADER="$(grep -m1 -E "^## \[${VERSION//./\\.}\]" CHANGELOG.md || true)"
          if [ -z "$HEADER" ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section — add it before tagging."
            exit 1
          fi
          # Body = everything between this header and the next '## [' header.
          awk -v hdr="$HEADER" '
            $0 == hdr { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::The [${VERSION}] section in CHANGELOG.md is empty."
            exit 1
          fi
          TITLE="$TAG"
          case "$HEADER" in
            *" — "*) TITLE="$TAG — ${HEADER#* — }" ;;
          esac
          PRERELEASE=false
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE=true ;;
          esac
          {
            echo "title=$TITLE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Title: $TITLE (prerelease=$PRERELEASE)"
          echo "----"; cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Idempotent: a release already published for this tag (e.g. by hand) is left as-is.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it unchanged."
            exit 0
          fi
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "$TAG" --title "$TITLE" --notes-file release_notes.md --verify-tag "${FLAGS[@]}"
